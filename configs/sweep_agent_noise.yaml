model:
  backend: deterministic_simulator
  agent_policy: highest_version_then_latest_timestamp
  taskset_version: 1
  seed: 1
  trials: 60
  bootstrap_samples: 2000
  distractors: 12
  delay_turns: 10
  freshness_limit: 10
  confidence_threshold: 0.6
  shared_noise_rate: 0.1
  shared_access_limit: 8
  communication_budget: 3
  api_cost_per_call_usd: 0.0
experiment:
  type: agent_memory
  tasks: [delayed_retrieval, corrected_fact]
  setups: [single_agent, shared_memory, shared_memory_noisy]
  team_sizes: [1, 3, 5]
  intervention: shared_noise_rate
  values: [0, 0.1, 0.25, 0.5]
